name: CI

on:
  push:
    branches: [dev, main]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        service: [cex-futures-engine, api-server]

    steps:
      - uses: actions/checkout@v4

      - name: Set env metadata
        id: meta
        run: |
          SHA_TAG="sha-$(echo ${{ github.sha }} | cut -c1-12)"
          if [ "${{ github.ref_name }}" = "main" ]; then
            ENV=prod
            K8S_PATH=k8s/prod/kustomization.yaml
          else
            ENV=dev
            K8S_PATH=k8s/dev/kustomization.yaml
          fi
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          IMAGE="ghcr.io/${OWNER}/spread-service/${{ matrix.service }}"
          echo "sha_tag=${SHA_TAG}"   >> $GITHUB_OUTPUT
          echo "env=${ENV}"           >> $GITHUB_OUTPUT
          echo "k8s_path=${K8S_PATH}" >> $GITHUB_OUTPUT
          echo "image=${IMAGE}"       >> $GITHUB_OUTPUT

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: services/${{ matrix.service }}/Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.sha_tag }}
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.env }}-latest

      - name: Update kustomization image tag
        run: |
          sed -i \
            "/name: .*\/${{ matrix.service }}/{n;s|newTag:.*|newTag: ${{ steps.meta.outputs.sha_tag }}|}" \
            "${{ steps.meta.outputs.k8s_path }}"

      - name: Commit & push image tag bump
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "${{ steps.meta.outputs.k8s_path }}"
          git diff --staged --quiet && exit 0
          git commit -m "chore(${{ matrix.service }}): ${{ steps.meta.outputs.env }} → ${{ steps.meta.outputs.sha_tag }}"
          # Retry push up to 5 times to handle concurrent matrix jobs
          for i in 1 2 3 4 5; do
            git pull --rebase && git push && break || sleep $((i * 3))
          done